uid: SR-0032
type: system_requirement
status: proposed
title: Do not underscore-prefix internal methods
text: Do not use an underscore prefix for internal methods of a React component,
  because underscore prefixes are sometimes used as a convention for private, which
  JavaScript does not enforce here.
normative: true
links:
- target: UR-0013
  type: implements
attrs:
  source_ref: 'Airbnb React/JSX Style Guide: Methods — No Underscore Prefix'
