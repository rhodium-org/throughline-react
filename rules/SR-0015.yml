uid: SR-0015
type: system_requirement
status: approved
title: Use double quotes for JSX attributes
text: >-
  Always use double quotes for JSX attributes, but single quotes for all other JavaScript,
  because HTML attributes conventionally use double quotes.
links:
- target: UR-0007
  type: implements
