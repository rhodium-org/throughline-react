uid: INT-0001
type: intent
status: approved
title: React components are written in one consistent, idiomatic JSX style
text: >-
  The Airbnb React/JSX Style Guide exists so that React components across a large codebase
  read as though written by one author: consistent component structure, naming,
  declaration, alignment, spacing and prop conventions, favouring idiomatic JSX and modern
  React so that any engineer can read and change component code they did not write.
normative: false
attrs:
  source_ref: "Airbnb React/JSX Style Guide"
